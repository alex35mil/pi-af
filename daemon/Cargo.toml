[package]
name = "piton"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Daemon and CLI that own pi coding agent processes and let several clients attach"
license = "MIT"
publish = false

[[bin]]
name = "piton"
path = "src/main.rs"

[dependencies]
futures-util = "0.3.34"
libc = "0.2.191"
nix = { version = "0.31.3", features = ["signal", "user"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
toml = "1.2.1"
usage-rs = { version = "7", features = ["completions"] }

[lints.rust]
# Denied everywhere; the one exception (clonefile(2) in worker.rs) is allowed locally with a SAFETY comment.
unsafe_code = "deny"

[lints.clippy]
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"

[dev-dependencies]
tempfile = "3.27.0"
